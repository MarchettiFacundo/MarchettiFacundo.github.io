<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín 💖</title>
    <style>
        /* Estilos generales */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('img/fondo1.jpg') center center / cover no-repeat, #ffccd5;
            z-index: -1;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
            color: white;
            position: relative;
        }

        /* Contenedor */
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }

        /* Imagen decorativa superior */
        .decor-top {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
        }

        /* Imagen del corazón */
        .heart-img {
            width: 80px;
            height: auto;
            margin-bottom: 5px;
        }

        /* Texto principal */
        h1 {
            font-size: 22px;
            font-weight: bold;
        }

        /* Botones */
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
            font-weight: bold;
        }

        .accept {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0px 5px 10px rgba(255, 77, 109, 0.4);
        }

        .reject {
            background-color: #555;
            color: white;
            font-size: 16px;
        }

        /* Mensajes */
        #loveMessage,
        #insistMessage {
            display: none;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        #insistMessage {
            color: rgb(159, 159, 159);
        }

        /* Animación de corazones */
        @keyframes floating-hearts {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        .heart-animation {
            position: absolute;
            font-size: 24px;
            color: #ff4d6d;
            animation: floating-hearts 3s linear infinite;
        }

        /* Imágenes decorativas inferiores */
        .decor-bottom {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <!-- Imágenes decorativas -->
    <img src="img/decoracion1.png" class="decor-top" alt="Decoración superior">

    <div class="container">
        <img src="img/corazon.png" class="heart-img" alt="Corazón">
        <h1>❤️¿Quieres ser mi San Valentín?❤️</h1>
        <div class="buttons">
            <button class="accept" id="acceptBtn" onclick="showLove()">Aceptar</button>
            <button class="reject" id="rejectBtn" onclick="resizeButtons()">Rechazar</button>
        </div>
        <div id="loveMessage">¡SIIIII! 💖 ¡Ya sabia que ibas a aceptar, TE AMO❤️! 💕</div>
        <div id="insistMessage"></div>
    </div>

    <img src="img/decoracion2.png" class="decor-bottom" alt="Decoración inferior">

    <script>
        let rejectCount = 0;
        const messages = [
            "😤 ¡Vamos, no seas malo!",
            "🤨 ¿Seguro que quieres rechazarme?",
            "😭 ¡Me estás rompiendo el corazón!",
            "😏 Sé que en el fondo quieres decir que sí...",
            "🥺 ¿No me darás una oportunidad?",
            "😂 Vamos, era broma, dale a Aceptar!",
            "😡 ¡No puedes rechazarme para siempre!",
            "😈 Cada vez que rechazas, mi amor crece más.",
            "👀 Estás jugando con fuego...",
            "🔥 Mientras más rechazas, más grande será mi amor.",
            "😵 ¿Qué tal si piensas mejor tu decisión?",
            "💔 Mi corazón no aguantará más rechazos...",
            "🥴 Creo que estás tocando el botón equivocado.",
            "😂 Ok, esto ya es personal...",
            "🤯 ¡Voy a llorar si sigues rechazando!",
            "😭 ¿Te das cuenta de lo que estás haciendo?",
            "🙄 *Suspira* No te cansas de rechazar, ¿eh?",
            "😏 Sé que es solo un juego, ¡pero ya dale a Aceptar!",
            "🎭 Ok, ahora sí me ofendí...",
            "💀 *Error 404: Rechazo no encontrado*"
        ];

        function showLove() {
            document.querySelector(".buttons").style.display = "none";
            document.getElementById("loveMessage").style.display = "block";
            document.getElementById("insistMessage").style.display = "none"; 

            for (let i = 0; i < 20; i++) {
                let heart = document.createElement("div");
                heart.classList.add("heart-animation");
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = (Math.random() * 2 + 2) + "s";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }

        function resizeButtons() {
            let acceptBtn = document.getElementById("acceptBtn");
            let rejectBtn = document.getElementById("rejectBtn");

            let currentRejectSize = parseInt(window.getComputedStyle(rejectBtn).fontSize);
            if (currentRejectSize > 8) {
                rejectBtn.style.fontSize = (currentRejectSize - 2) + "px";
            }

            let currentAcceptSize = parseInt(window.getComputedStyle(acceptBtn).fontSize);
            acceptBtn.style.fontSize = (currentAcceptSize + 2) + "px";

            rejectCount++;

            let messageIndex = Math.floor(Math.random() * messages.length);
            document.getElementById("insistMessage").innerText = messages[messageIndex];
            document.getElementById("insistMessage").style.display = "block";

        }
    </script>
</body>

</html>
