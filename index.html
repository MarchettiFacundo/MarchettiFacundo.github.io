<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: pink;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .heart {
            font-size: 50px;
            color: red;
        }
        .container {
            position: relative;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .accept {
            background-color: red;
            color: white;
        }
        .reject {
            background-color: gray;
            color: white;
            position: absolute;
        }
        .hidden {
            display: none;
        }
        @keyframes floating-hearts {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
        .heart-animation {
            position: absolute;
            font-size: 24px;
            color: red;
            animation: floating-hearts 3s linear infinite;
        }
    </style>
</head>
<body>
    <h1 class="heart">❤️ ¿Quieres ser mi San Valentín? ❤️</h1>
    <div class="container">
        <div class="buttons">
            <button class="accept" onclick="showLove()">Aceptar</button>
            <button class="reject" id="rejectBtn" onmouseover="moveButton()">Rechazar</button>
        </div>
    </div>
    <div id="loveMessage" class="hidden">
        <h2>¡Yuju! 💖 ¡Sabía que dirías que sí! 💕</h2>
    </div>

    <script>
        function showLove() {
            document.querySelector(".buttons").classList.add("hidden");
            document.getElementById("loveMessage").classList.remove("hidden");

            for (let i = 0; i < 20; i++) {
                let heart = document.createElement("div");
                heart.classList.add("heart-animation");
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = (Math.random() * 2 + 2) + "s";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }

        function moveButton() {
            let btn = document.getElementById("rejectBtn");
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 50);
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;
        }
    </script>
</body>
</html>
